name: evals-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_MODEL_ID: ${{ vars.TARGET_MODEL_ID }}
  JUDGE_MODEL_ID: ${{ vars.JUDGE_MODEL_ID }}
  REDTEAM_JUDGE_MODEL_ID: ${{ vars.REDTEAM_JUDGE_MODEL_ID }}
  ATTACKER_MODEL_ID: ${{ vars.ATTACKER_MODEL_ID }}
  SENTINEL_ROLE_ARN: ${{ secrets.SENTINEL_ROLE_ARN }}

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      # Gate: no run may hide a failure (FailureCommunication pass rate must be 1.0 over 3 repeats). The overall
      # score is printed for information; it has a ceiling near 0.75 by construction (see evals.chaos.gate).
      - run: uv run python -m evals.chaos --prompt "$(cat agent/prompts/CURRENT)" --repeats 3 --out ci-chaos.json --gate-evaluator FailureCommunicationEvaluator --fail-on 1.0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: chaos-report
          path: ci-chaos.json

  redteam-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - run: uv run python -m evals.regression --out ci-regression.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: regression-report
          path: ci-regression.json

  deploy:
    needs: [chaos, redteam-regression]
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate verde; aca iria el deploy real (agentcore deploy, helm, lo que sea)"
